name: Validate dependency maintenance
on:
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and run pinned actionlint on changed workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t workflows < <(git diff --name-only "$BASE_SHA" HEAD -- .github/workflows | grep -E '\.ya?ml$' || true)
          if (( ${#workflows[@]} == 0 )); then
            workflows=(.github/workflows/dependency-maintenance.yml)
          fi
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= "${workflows[@]}"
