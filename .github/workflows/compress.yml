name: Compress

# on:
#   pull_request:
#     paths:
#       - "src/**.png"
on:
  push:
    branches-ignore:
      - "**"

jobs:
  compress:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Find symlinked paths to ignore
        id: find
        run: |
          printf 'ignore=%s\n' "$(find -L src -xtype l -type d | sed -e 's#$#/**#' | head -c -1 | tr '\n' ',')" >> "$GITHUB_OUTPUT"
      - name: Check ignored paths
        run: echo ${{ steps.find.outputs.ignore }} | tr ',' '\n'
      - name: Compress Images
        uses: calibreapp/image-actions@master
        with:
          ignorePaths: ${{ steps.find.outputs.ignore }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
